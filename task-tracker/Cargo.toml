[package]
name = "task-tracker"
version = "0.1.0"
authors = ["Ocki Bagus P. <ocki.bagus.p@gmail.com>"]
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.0"
clap = { version = "4.6.0", features = ["derive"] }
lazy_static = "1.5.0"
dotenv = "0.15.0"
mockall = { version = "0.13.1" }
once_cell = "1.21.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.16.0" # Use the latest version available that meets the ^3.0.0 requirement

